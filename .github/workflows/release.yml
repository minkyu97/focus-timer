name: Release Deploy

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-macos-app:
    name: Build macOS app
    runs-on: macos-26

    env:
      PROJECT: focus-timer.xcodeproj
      SCHEME: focus-timer
      CONFIGURATION: Release
      APP_NAME: Focus Timer
      ASSET_NAME: Focus-Timer-macOS.app.zip

    steps:
      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            tag="${{ github.event.release.tag_name }}"
          else
            tag="${{ inputs.tag }}"
          fi

          if [[ -z "$tag" ]]; then
            echo "A release tag is required." >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release_tag.outputs.tag }}

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build Release app with ad-hoc signing
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk macosx \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_IDENTITY="-" \
            build

      - name: Locate built app
        id: app
        shell: bash
        run: |
          set -euo pipefail

          app_path="$RUNNER_TEMP/DerivedData/Build/Products/$CONFIGURATION/$APP_NAME.app"

          if [[ ! -d "$app_path" ]]; then
            echo "Expected app bundle was not found: $app_path" >&2
            find "$RUNNER_TEMP/DerivedData/Build/Products" -maxdepth 4 -name "*.app" -print >&2 || true
            exit 1
          fi

          echo "app_path=$app_path" >> "$GITHUB_OUTPUT"

      - name: Verify ad-hoc signature
        shell: bash
        run: |
          set -euo pipefail

          app_path="${{ steps.app.outputs.app_path }}"

          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign --display --verbose=4 "$app_path"

      - name: Package .app bundle
        id: package
        shell: bash
        run: |
          set -euo pipefail

          app_path="${{ steps.app.outputs.app_path }}"
          output_dir="$RUNNER_TEMP/release"
          asset_path="$output_dir/$ASSET_NAME"

          mkdir -p "$output_dir"

          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$asset_path"

          echo "asset_path=$asset_path" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: ${{ steps.package.outputs.asset_path }}
          if-no-files-found: error

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release_tag.outputs.tag }}
          ASSET_PATH: ${{ steps.package.outputs.asset_path }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$ASSET_PATH" --clobber
          else
            gh release create "$TAG_NAME" "$ASSET_PATH" \
              --title "$TAG_NAME" \
              --notes "Release $TAG_NAME" \
              --verify-tag
          fi