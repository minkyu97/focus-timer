name: Release Deploy

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-macos-app:
    name: Build macOS app
    runs-on: macos-26

    env:
      PROJECT: focus-timer.xcodeproj
      SCHEME: focus-timer
      CONFIGURATION: Release
      APP_NAME: Focus Timer
      APPCAST_NAME: appcast.xml
      RELEASE_NOTES_NAME: release-notes.html
      SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}

    steps:
      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            tag="${{ github.event.release.tag_name }}"
          else
            tag="${{ inputs.tag }}"
          fi

          if [[ -z "$tag" ]]; then
            echo "A release tag is required." >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release_tag.outputs.tag }}

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build Release app with ad-hoc signing
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SPARKLE_PUBLIC_ED_KEY:-}" ]]; then
            echo "SPARKLE_PUBLIC_ED_KEY repository variable is required for Sparkle releases." >&2
            exit 1
          fi

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk macosx \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_IDENTITY="-" \
            SPARKLE_PUBLIC_ED_KEY="$SPARKLE_PUBLIC_ED_KEY" \
            build

      - name: Locate built app
        id: app
        shell: bash
        run: |
          set -euo pipefail

          app_path="$RUNNER_TEMP/DerivedData/Build/Products/$CONFIGURATION/$APP_NAME.app"

          if [[ ! -d "$app_path" ]]; then
            echo "Expected app bundle was not found: $app_path" >&2
            find "$RUNNER_TEMP/DerivedData/Build/Products" -maxdepth 4 -name "*.app" -print >&2 || true
            exit 1
          fi

          echo "app_path=$app_path" >> "$GITHUB_OUTPUT"

          short_version="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app_path/Contents/Info.plist")"
          bundle_version="$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$app_path/Contents/Info.plist")"

          if [[ -z "$short_version" || -z "$bundle_version" ]]; then
            echo "Version metadata was not found in Info.plist." >&2
            exit 1
          fi

          echo "short_version=$short_version" >> "$GITHUB_OUTPUT"
          echo "bundle_version=$bundle_version" >> "$GITHUB_OUTPUT"
          echo "asset_name=Focus-Timer-$short_version.app.zip" >> "$GITHUB_OUTPUT"

      - name: Verify ad-hoc signature
        shell: bash
        run: |
          set -euo pipefail

          app_path="${{ steps.app.outputs.app_path }}"

          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign --display --verbose=4 "$app_path"

      - name: Package .app bundle
        id: package
        shell: bash
        run: |
          set -euo pipefail

          app_path="${{ steps.app.outputs.app_path }}"
          output_dir="$RUNNER_TEMP/release"
          asset_path="$output_dir/${{ steps.app.outputs.asset_name }}"

          mkdir -p "$output_dir"

          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$asset_path"

          echo "asset_path=$asset_path" >> "$GITHUB_OUTPUT"

      - name: Generate Sparkle appcast
        id: sparkle_appcast
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TAG_NAME: ${{ steps.release_tag.outputs.tag }}
          ASSET_PATH: ${{ steps.package.outputs.asset_path }}
          ASSET_NAME: ${{ steps.app.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SPARKLE_PRIVATE_KEY:-}" ]]; then
            echo "SPARKLE_PRIVATE_KEY repository secret is required to sign Sparkle updates." >&2
            exit 1
          fi

          sign_update="$(find "$RUNNER_TEMP/DerivedData/SourcePackages/artifacts" -path "*/Sparkle/bin/sign_update" -type f -print -quit)"

          if [[ -z "$sign_update" ]]; then
            echo "Sparkle sign_update tool was not found in SwiftPM artifacts." >&2
            find "$RUNNER_TEMP/DerivedData/SourcePackages" -maxdepth 6 -type f -name "sign_update" -print >&2 || true
            exit 1
          fi

          key_file="$RUNNER_TEMP/sparkle_private_key"
          printf "%s" "$SPARKLE_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"

          signature_attrs="$("$sign_update" -f "$key_file" "$ASSET_PATH")"
          rm -f "$key_file"

          app_path="${{ steps.app.outputs.app_path }}"
          short_version="${{ steps.app.outputs.short_version }}"
          bundle_version="${{ steps.app.outputs.bundle_version }}"
          minimum_system_version="$(/usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$app_path/Contents/Info.plist" 2>/dev/null || echo "13.0")"
          archive_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/${ASSET_NAME}"
          release_notes_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/${RELEASE_NOTES_NAME}"
          pub_date="$(LC_ALL=C date -u "+%a, %d %b %Y %H:%M:%S +0000")"
          output_dir="$RUNNER_TEMP/release"
          appcast_path="$output_dir/$APPCAST_NAME"
          release_json_path="$RUNNER_TEMP/release.json"
          release_notes_markdown_path="$RUNNER_TEMP/release-notes.md"
          release_notes_payload_path="$RUNNER_TEMP/release-notes-payload.json"
          release_notes_fragment_path="$RUNNER_TEMP/release-notes-fragment.html"
          release_notes_title_path="$RUNNER_TEMP/release-notes-title.txt"
          release_notes_path="$output_dir/$RELEASE_NOTES_NAME"

          if gh release view "$TAG_NAME" --json name,body > "$release_json_path" 2>/dev/null; then
            python3 - "$release_json_path" "$release_notes_title_path" "$release_notes_markdown_path" "$TAG_NAME" <<'PY'
          import json
          import sys

          release_json_path, title_path, markdown_path, tag_name = sys.argv[1:]

          with open(release_json_path, "r", encoding="utf-8") as file:
              release = json.load(file)

          title = release.get("name") or tag_name
          body = release.get("body") or f"Release {tag_name}"

          with open(title_path, "w", encoding="utf-8") as file:
              file.write(title)

          with open(markdown_path, "w", encoding="utf-8") as file:
              file.write(body)
          PY
          else
            printf "%s" "$TAG_NAME" > "$release_notes_title_path"
            printf "Release %s" "$TAG_NAME" > "$release_notes_markdown_path"
          fi

          python3 - "$release_notes_markdown_path" "$release_notes_payload_path" "$GITHUB_REPOSITORY" <<'PY'
          import json
          import sys

          markdown_path, payload_path, repository = sys.argv[1:]

          with open(markdown_path, "r", encoding="utf-8") as file:
              markdown = file.read()

          with open(payload_path, "w", encoding="utf-8") as file:
              json.dump(
                  {
                      "text": markdown,
                      "mode": "gfm",
                      "context": repository,
                  },
                  file,
              )
          PY

          if ! gh api /markdown --input "$release_notes_payload_path" > "$release_notes_fragment_path"; then
            python3 - "$release_notes_markdown_path" "$release_notes_fragment_path" <<'PY'
          import html
          import sys

          markdown_path, fragment_path = sys.argv[1:]

          with open(markdown_path, "r", encoding="utf-8") as file:
              markdown = file.read()

          with open(fragment_path, "w", encoding="utf-8") as file:
              file.write(f"<pre>{html.escape(markdown)}</pre>")
          PY
          fi

          python3 - "$release_notes_title_path" "$release_notes_fragment_path" "$release_notes_path" "$short_version" <<'PY'
          import html
          import sys

          title_path, fragment_path, release_notes_path, short_version = sys.argv[1:]

          with open(title_path, "r", encoding="utf-8") as file:
              title = file.read().strip() or f"Focus Timer {short_version}"

          with open(fragment_path, "r", encoding="utf-8") as file:
              body = file.read()

          document = f"""<!doctype html>
          <html lang=\"en\">
          <head>
            <meta charset=\"utf-8\">
            <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">
            <style>
              :root {{
                color-scheme: light dark;
              }}
              body {{
                margin: 0;
                padding: 16px;
                color: CanvasText;
                background: Canvas;
                font: 13px -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif;
                line-height: 1.45;
              }}
              h1 {{
                margin: 0 0 12px;
                font-size: 18px;
                line-height: 1.25;
              }}
              h2, h3 {{
                margin: 16px 0 8px;
                font-size: 15px;
              }}
              p, ul, ol, pre {{
                margin: 0 0 10px;
              }}
              ul, ol {{
                padding-left: 22px;
              }}
              a {{
                color: LinkText;
              }}
              code, pre {{
                font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                white-space: pre-wrap;
              }}
            </style>
          </head>
          <body>
            <h1>{html.escape(title)}</h1>
            {body}
          </body>
          </html>
          """

          with open(release_notes_path, "w", encoding="utf-8") as file:
              file.write(document)
          PY

          cat > "$appcast_path" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Focus Timer Updates</title>
              <link>https://github.com/${GITHUB_REPOSITORY}/releases</link>
              <description>Focus Timer update feed</description>
              <language>en</language>
              <item>
                <title>Focus Timer ${short_version}</title>
                <pubDate>${pub_date}</pubDate>
                <sparkle:version>${bundle_version}</sparkle:version>
                <sparkle:shortVersionString>${short_version}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>${minimum_system_version}</sparkle:minimumSystemVersion>
                <sparkle:releaseNotesLink>${release_notes_url}</sparkle:releaseNotesLink>
                <enclosure url="${archive_url}" ${signature_attrs} type="application/zip" />
              </item>
            </channel>
          </rss>
          EOF

          echo "appcast_path=$appcast_path" >> "$GITHUB_OUTPUT"
          echo "release_notes_path=$release_notes_path" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            ${{ steps.package.outputs.asset_path }}
            ${{ steps.sparkle_appcast.outputs.appcast_path }}
            ${{ steps.sparkle_appcast.outputs.release_notes_path }}
          if-no-files-found: error

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release_tag.outputs.tag }}
          ASSET_PATH: ${{ steps.package.outputs.asset_path }}
          APPCAST_PATH: ${{ steps.sparkle_appcast.outputs.appcast_path }}
          RELEASE_NOTES_PATH: ${{ steps.sparkle_appcast.outputs.release_notes_path }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$ASSET_PATH" "$APPCAST_PATH" "$RELEASE_NOTES_PATH" --clobber
          else
            gh release create "$TAG_NAME" "$ASSET_PATH" "$APPCAST_PATH" "$RELEASE_NOTES_PATH" \
              --title "$TAG_NAME" \
              --notes "Release $TAG_NAME" \
              --verify-tag
          fi
